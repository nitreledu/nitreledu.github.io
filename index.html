<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NETREL Educational Institute</title>
<meta name="description" content="NETREL Educational Institute: classes, teachers, time table and fees.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<style>
:root{--ink:#14213D;--bg:#F7F8FA;--card:#fff;--text:#1B2333;--muted:#5B6578;--line:#DDE2EA;--amber:#F2A900;--teal:#0F766E;--tealbg:#E3F3F1}
@media (prefers-color-scheme:dark){:root{--ink:#E8ECF5;--bg:#0E1424;--card:#172038;--text:#E6E9F2;--muted:#9AA5BD;--line:#2A3556;--tealbg:#12312F;--teal:#5EEAD4}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.6 Inter,"Noto Sans Sinhala","Noto Sans Tamil",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
body[data-l=si],body[data-l=ta]{line-height:1.85}
h1,h2,h3{font-family:Fraunces,"Noto Sans Sinhala","Noto Sans Tamil",Georgia,serif;color:var(--ink);line-height:1.2;margin:0 0 .5em}
body[data-l=si] h1,body[data-l=ta] h1{line-height:1.35}
h1{font-size:clamp(1.9rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,4vw,2.2rem)}
h3{font-size:1.15rem}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{display:flex;align-items:center;gap:10px;min-height:60px;position:relative}
.logo{font:800 1.25rem Fraunces,serif;color:var(--ink);text-decoration:none;line-height:1.1;margin-right:auto}
.logo small{display:block;font:500 .7rem Inter,sans-serif;color:var(--muted)}
nav{display:flex;gap:2px}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:500;color:var(--muted)}
nav a:hover{background:var(--tealbg)}
nav a[aria-current=page]{background:var(--ink);color:var(--bg)}
select,input,textarea{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:1rem Inter,"Noto Sans Sinhala","Noto Sans Tamil",sans-serif;max-width:100%}
.lang{padding:8px;min-height:44px}
#mb{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;padding:0;flex-direction:column;justify-content:center;align-items:center;gap:5px}
#mb i{display:block;width:20px;height:2px;background:currentColor;transition:transform .2s,opacity .2s}
#mb[aria-expanded=true] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
#mb[aria-expanded=true] i:nth-child(2){opacity:0}
#mb[aria-expanded=true] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
section.page{display:none;padding:36px 0 64px}
section.page.on{display:block}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero p{font-size:1.05rem;color:var(--muted);max-width:52ch}
.btn{display:inline-block;padding:12px 22px;min-height:44px;border-radius:10px;background:var(--amber);color:#14213D;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:1rem;font-family:inherit;margin:0 8px 8px 0}
.btn.alt{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.btn.sm{padding:6px 12px;min-height:36px;margin:0}
.today{background:var(--ink);color:var(--bg);border-radius:16px;padding:22px}
.today h3{color:var(--amber)}
.today ul{list-style:none;padding:0;margin:0}
.today li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(128,128,128,.35)}
.today small{opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;background:var(--tealbg);color:var(--teal);padding:2px 10px;border-radius:99px;margin-right:6px}
.muted{color:var(--muted)}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:40px 0 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts b{display:block;font:800 1.8rem Fraunces,serif;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font:500 .95rem inherit;font-family:inherit}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--amber);color:#14213D;display:grid;place-items:center;font:800 1.8rem Fraunces,serif;margin-bottom:12px;position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tt{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;font-size:.92rem}
th{background:var(--tealbg);color:var(--ink)}
td.slot{background:var(--bg);font-weight:600;white-space:nowrap}
td b{display:block}
.ttcards{display:none;gap:12px}
.ttcards .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fees td:last-child,.fees th:last-child{text-align:right;white-space:nowrap}
form.f{display:grid;gap:12px;max-width:460px}
label{font-weight:500;display:grid;gap:4px}
.ad{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;margin-bottom:20px}
.note{background:var(--tealbg);border-radius:10px;padding:12px 14px;margin:0 0 20px;font-size:.92rem}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem}
@media (max-width:860px){
  #mb{display:flex}
  nav{display:none;position:absolute;top:100%;left:-16px;right:-16px;flex-direction:column;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px 14px;box-shadow:0 12px 24px rgba(0,0,0,.15)}
  nav.open{display:flex}
  nav a{padding:14px 12px;font-size:1.05rem}
}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  section.page{padding:24px 0 48px}
  .tt table{display:none}
  .ttcards{display:grid}
  .btn{display:block;text-align:center;margin-right:0}
  .facts{gap:18px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#mb i{transition:none}}
</style>
</head>
<body data-l="en">
<header>
  <div class="wrap bar">
    <a class="logo" href="#home">NETREL<small>Educational Institute</small></a>

    <button id="mb" aria-expanded="false" aria-controls="nav" aria-label="Menu"><i></i><i></i><i></i></button>
  </div>
</header>

<main class="wrap">
  <section id="home" class="page">
    <div class="hero">

        <h1 data-i="h1"></h1>

        <p><a class="btn" href="#classes" data-i="browse"></a><a class="btn alt" href="#timetable" data-i="seett"></a></p>

      <div class="today"><h3 data-i="next"></h3><ul id="next"></ul></div>
    </div>
    <div class="facts">
      <div><b id="fClasses"></b><span data-i="nclasses"></span></div>
      <div><b id="fTeachers"></b><span data-i="nteachers"></span></div>
      <div><b>20</b><span data-i="maxs"></span></div>
    </div>
  </section>

  <section id="classes" class="page">
    <h2 data-i="classes"></h2>
    <p class="muted" data-i="pick"></p>
    <div class="chips" id="classChips"></div>
    <div class="grid" id="classList"></div>
  </section>

  <section id="teachers" class="page">
    <h2 data-i="teachers"></h2>
    <p class="muted" data-i="tsub"></p>
    <div class="grid" id="teacherList"></div>
  </section>

  <section id="timetable" class="page">
    <h2 data-i="timetable"></h2>
    <label for="ttClass" style="max-width:320px"><span data-i="showtt"></span><select id="ttClass"></select></label>
    <div class="tt" id="ttOut"></div>
    <div class="ttcards" id="ttCards"></div>
  </section>

  <section id="fees" class="page">
    <h2 data-i="fees"></h2>
    <p class="muted" data-i="fsub"></p>
    <div class="tt"><table class="fees" style="display:table"><thead><tr><th data-i="class"></th><th data-i="fee"></th></tr></thead><tbody id="feeBody"></tbody></table></div>
    <p class="note" data-i="fnote"></p>
  </section>

  <section id="about" class="page">
    <h2 data-i="aboutt"></h2>
    <p style="max-width:62ch" data-i="aboutp"></p>
    <div class="grid" style="margin:26px 0">
      <div class="card"><h3 data-i="appr"></h3><p class="muted" data-i="apprp"></p></div>
      <div class="card"><h3 data-i="where"></h3><p class="muted">123 Main Street, Your Town<br>Mon–Sat, 8:00–18:00</p></div>
      <div class="card"><h3 data-i="contact"></h3><p class="muted">+94 00 000 0000<br>hello@yourinstitute.lk</p></div>
    </div>
    <h3 data-i="enrol"></h3>
    <form class="f" id="contact">
      <label><span data-i="name"></span><input name="name" required></label>
      <label><span data-i="phone"></span><input name="phone" type="tel" required></label>
      <label><span data-i="msg"></span><textarea name="msg" rows="3"></textarea></label>
      <button class="btn" type="submit" data-i="send"></button>
      <p id="sent" class="muted" role="status"></p>
    </form>
  </section>

  <section id="admin" class="page">
    <h2>Admin</h2>
    <div id="adminBox"></div>
  </section>
</main>

<footer><div class="wrap">© <span id="yr"></span> NETREL Educational Institute · <a href="#admin" data-i="admin"></a></div></footer>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
let D, L = "en", gradeFilter = "all", authed = false;
const t = k => T[L][k] ?? T.en[k];
const teacher = id => D.teachers.find(x => x.id === id);
const klass = id => D.classes.find(c => c.id === id);
const money = n => "Rs. " + Number(n).toLocaleString("en-US");
const dayName = d => T[L].d[DAYS.indexOf(d)];
const bySlot = (a,b) => DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || a.start.localeCompare(b.start);

function load(){ try{ const s = JSON.parse(localStorage.getItem("netrel_data")); if(s){ D.timetable = s.timetable; D.classes.forEach(c => { if(s.fees && s.fees[c.id] != null) c.fee = s.fees[c.id]; }); } }catch(e){} }
function save(){ try{ localStorage.setItem("netrel_data", JSON.stringify({timetable:D.timetable, fees:Object.fromEntries(D.classes.map(c => [c.id,c.fee]))})); }catch(e){} }

function applyLang(){
  document.documentElement.lang = L; document.body.dataset.l = L;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  $("#lang").value = L;
  renderAll();
}
function renderHome(){
  $("#fClasses").textContent = D.classes.length; $("#fTeachers").textContent = D.teachers.length;
  const now = new Date(), today = now.getDay(), mins = now.getHours()*60 + now.getMinutes();
  const order = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const up = D.timetable.map(s => { const [h,m] = s.start.split(":").map(Number); let dd = (order.indexOf(s.day)-today+7)%7; if(dd===0 && h*60+m < mins) dd = 7; return {...s, when:dd*1440+h*60+m}; }).sort((a,b)=>a.when-b.when).slice(0,4);
  $("#next").innerHTML = up.map(s => `<li><span>${esc(klass(s.cls).name)}<br><small>${esc(teacher(klass(s.cls).teacher).name)}</small></span><span>${dayName(s.day)} ${s.start}</span></li>`).join("");
}
function renderClasses(){
  const grades = ["all", ...new Set(D.classes.map(c => c.grade))];
  $("#classChips").innerHTML = grades.map(g => `<button class="chip" aria-pressed="${g===gradeFilter}" data-g="${esc(g)}">${g==="all"?t("all"):esc(g)}</button>`).join("");
  $("#classList").innerHTML = D.classes.filter(c => gradeFilter==="all" || c.grade===gradeFilter).map(c => `<article class="card"><span class="tag">${esc(c.grade)}</span><h3 style="margin-top:10px">${esc(c.name)}</h3><p class="muted">${esc(c.desc)}</p><p><b>${esc(teacher(c.teacher).name)}</b><br><span class="muted">${money(c.fee)} ${t("mo")}</span></p></article>`).join("");
}
function renderTeachers(){
  $("#teacherList").innerHTML = D.teachers.map(x => `<article class="card"><div class="avatar">${x.photo?`<img src="${esc(x.photo)}" alt="${esc(x.name)}" loading="lazy" onerror="this.remove()">`:""}<span aria-hidden="true">${esc(x.name.split(" ").map(w=>w[0]).join(""))}</span></div><h3>${esc(x.name)}</h3><span class="tag">${esc(x.subject)}</span><p class="muted">${esc(x.bio)}</p><p style="font-size:.9rem">${t("teaches")} ${D.classes.filter(c=>c.teacher===x.id).map(c=>esc(c.name)).join(", ")}</p></article>`).join("");
}
function renderTT(){
  const sel = $("#ttClass").value || "all";
  const rows = D.timetable.filter(s => sel==="all" || s.cls===sel).sort(bySlot);
  const slots = [...new Set(rows.map(r => r.start+"–"+r.end))].sort();
  $("#ttOut").innerHTML = `<table><thead><tr><th>${t("time")||"Time"}</th>${DAYS.map(d=>`<th>${dayName(d)}</th>`).join("")}</tr></thead><tbody>` + slots.map(sl => `<tr><td class="slot">${sl}</td>` + DAYS.map(d => { const s = rows.find(r => r.day===d && r.start+"–"+r.end===sl); return `<td>${s?`<b>${esc(klass(s.cls).name)}</b>${esc(teacher(klass(s.cls).teacher).name)}<br><span class="muted">${esc(s.room)}</span>`:""}</td>`; }).join("") + `</tr>`).join("") + `</tbody></table>`;
  $("#ttCards").innerHTML = DAYS.map(d => { const r = rows.filter(x => x.day===d); return r.length ? `<div class="card"><h3>${dayName(d)}</h3>${r.map(s => `<div class="row"><span><b>${esc(klass(s.cls).name)}</b><br><span class="muted">${esc(teacher(klass(s.cls).teacher).name)} · ${esc(s.room)}</span></span><span>${s.start}–${s.end}</span></div>`).join("")}</div>` : ""; }).join("");
}
function renderTTSelect(){
  const v = $("#ttClass").value || "all";
  $("#ttClass").innerHTML = `<option value="all">${t("allcl")}</option>` + D.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#ttClass").value = v;
}
function renderFees(){ $("#feeBody").innerHTML = D.classes.map(c => `<tr><td>${esc(c.name)}<br><span class="muted">${esc(teacher(c.teacher).name)}</span></td><td>${money(c.fee)} ${t("mo")}</td></tr>`).join(""); }
function renderAdmin(){
  const box = $("#adminBox");
  if(!authed){ box.innerHTML = `<form class="f" id="login"><label>Passcode<input type="password" id="pw" required autocomplete="off"></label><button class="btn" type="submit">Log in</button><p id="lerr" class="muted" role="status"></p></form>`; return; }
  const cOpts = D.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const rows = [...D.timetable].sort(bySlot);
  box.innerHTML = `<p class="note">Changes are saved in this browser only. To publish them for every visitor, press “Show data”, then paste the timetable and fees into the DATA block of index.html and upload it to GitHub (or connect a database later).</p>
  <h3>Add a class slot</h3>
  <form id="addSlot" class="ad">
    <label>Day<select name="day">${DAYS.map(d=>`<option>${d}</option>`).join("")}</select></label>
    <label>Start<input type="time" name="start" required></label>
    <label>End<input type="time" name="end" required></label>
    <label>Class<select name="cls">${cOpts}</select></label>
    <label>Room<input name="room" required></label>
    <button class="btn" type="submit" style="margin:0">Add</button>
  </form>
  <h3>Time table slots</h3>
  <div class="tt"><table style="display:table"><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Room</th><th></th></tr></thead><tbody>${rows.map(s => `<tr><td>${s.day}</td><td>${s.start}–${s.end}</td><td>${esc(klass(s.cls).name)}</td><td>${esc(s.room)}</td><td><button class="btn alt sm" data-del="${D.timetable.indexOf(s)}">Delete</button></td></tr>`).join("")}</tbody></table></div>
  <h3 style="margin-top:28px">Fees (Rs. per month)</h3>
  <div class="ad">${D.classes.map(c => `<label>${esc(c.name)}<input type="number" min="0" step="100" value="${c.fee}" data-fee="${c.id}"></label>`).join("")}</div>
  <button class="btn alt" data-act="show">Show data</button><button class="btn alt" data-act="reset">Reset to original</button><button class="btn alt" data-act="out">Log out</button>
  <textarea id="dump" rows="8" style="width:100%;display:none;margin-top:10px" readonly></textarea>`;
}
function renderAll(){ renderHome(); renderClasses(); renderTeachers(); renderTTSelect(); renderTT(); renderFees(); renderAdmin(); }

const PAGES = ["home","classes","teachers","timetable","fees","about","admin"];
function route(){
  const p = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
  PAGES.forEach(id => $("#"+id).classList.toggle("on", id===p));
  document.querySelectorAll("nav a").forEach(a => a.getAttribute("href")==="#"+p ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  document.title = (p==="home" ? "" : (t(p)||p) + " · ") + "NETREL Educational Institute";
  closeMenu(); window.scrollTo(0,0);
}
function closeMenu(){ $("#nav").classList.remove("open"); $("#mb").setAttribute("aria-expanded","false"); }

$("#mb").addEventListener("click", () => { const o = $("#nav").classList.toggle("open"); $("#mb").setAttribute("aria-expanded", o); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeMenu(); });
$("#lang").addEventListener("change", e => { L = e.target.value; try{localStorage.setItem("netrel_lang", L);}catch(x){} applyLang(); route(); });
$("#ttClass").addEventListener("change", renderTT);
$("#classChips").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if(b){ gradeFilter = b.dataset.g; renderClasses(); } });
$("#contact").addEventListener("submit", e => { e.preventDefault(); $("#sent").textContent = t("thanks"); e.target.reset(); /* later: POST to your backend */ });

const ab = $("#adminBox");
ab.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id === "login"){ if($("#pw").value === ADMIN_PASS){ authed = true; renderAdmin(); } else $("#lerr").textContent = "Wrong passcode."; }
  if(e.target.id === "addSlot"){ const f = Object.fromEntries(new FormData(e.target)); if(f.end <= f.start){ alert("End time must be after start time."); return; } D.timetable.push({day:f.day,start:f.start,end:f.end,cls:f.cls,room:f.room.trim()}); save(); renderAll(); }
});
ab.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.del != null){ D.timetable.splice(+b.dataset.del,1); save(); renderAll(); }
  if(b.dataset.act === "show"){ const d = $("#dump"); d.style.display = "block"; d.value = JSON.stringify({timetable:D.timetable, fees:Object.fromEntries(D.classes.map(c=>[c.id,c.fee]))}, null, 1); d.select(); }
  if(b.dataset.act === "reset" && confirm("Remove all saved changes?")){ try{localStorage.removeItem("netrel_data");}catch(x){} location.reload(); }
  if(b.dataset.act === "out"){ authed = false; renderAdmin(); }
});
ab.addEventListener("change", e => { const id = e.target.dataset.fee; if(id){ klass(id).fee = Math.max(0, +e.target.value || 0); save(); renderAll(); } });

$("#yr").textContent = new Date().getFullYear();
getData().then(d => {
  D = d; load();
  try{ const l = localStorage.getItem("netrel_lang"); if(T[l]) L = l; }catch(x){}
  applyLang(); window.addEventListener("hashchange", route); route();
});
</script>
</body>
</html>
